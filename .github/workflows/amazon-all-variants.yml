name: Amazon All Variants Stock Watch

on:
  push:
    paths:
      - .github/workflows/amazon-all-variants.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amazon-all-variants-stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check all Amazon variants and notify on newly available stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python amazon_all_variants.py

      - name: Save confirmed stock state
        if: success()
        run: |
          git add amazon_variants_state.json
          if git diff --cached --quiet; then
            echo "No stock state changes"
            exit 0
          fi
          git config user.name "iphone-stock-bot"
          git config user.email "iphone-stock-bot@users.noreply.github.com"
          git commit -m "Update Amazon variants stock state"
          git pull --rebase origin main
          git push
