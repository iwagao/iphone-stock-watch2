name: One-time ntfy notification test
on:
  push:
    paths:
      - .github/workflows/notification-test-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Send clearly labeled test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "TEST NOTIFY FAILED: NTFY_TOPIC missing"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          latest_path = Path("latest_results.json")
          lines = ["【在庫確認テスト】"]
          if latest_path.exists():
              latest = json.loads(latest_path.read_text(encoding="utf-8"))
              for store, result in latest.get("results", {}).items():
                  status = {"IN STOCK": "○", "OUT": "×", "UNKNOWN": "？"}.get(result.get("status"), "？")
                  checked = result.get("checked_at_utc")
                  try:
                      dt = datetime.fromisoformat(checked.replace("Z", "+00:00")).astimezone(timezone(timedelta(hours=9)))
                      when = dt.strftime("%m/%d %H:%M")
                  except (ValueError, AttributeError, TypeError):
                      when = "時刻不明"
                  lines.append(f"{store}: {status}  {when}")
          else:
              lines.append("検出時刻: ？（次回監視から記録）")
          summary = "\n".join(lines)
          payload = {
              "topic": os.environ["NTFY_TOPIC"],
              "title": "iPhone 在庫監視 通知テスト",
              "message": summary,
              "priority": 4,
              "tags": ["test_tube"],
          }
          request = urllib.request.Request(
              "https://ntfy.sh",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              result = json.loads(response.read())
              print("TEST NOTIFY SENT / HTTP", response.status, "/ message-id", result.get("id", "unknown"))
          PY
