name: iPhone Stock Watch

on:
  push:
    paths:
      - "watch.py"
      - "requirements.txt"
      - ".github/workflows/stock-watch.yml"
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify notification secret
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret is not configured"
            exit 1
          fi
          echo "Notification secret is configured"

      - name: Check three stores via Jina
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py

      - name: Save stock state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "iphone-stock-bot"
          git config user.email "iphone-stock-bot@users.noreply.github.com"
          git add state.json
          git commit -m "Update stock state"
          git pull --rebase origin main
          git push
