name: Probe Amazon B0HJBC97W8

on:
  push:
    paths:
      - ".github/workflows/probe-amazon-b0hjbc97w8.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Amazon product
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 -L -sS --fail --max-time 45             -A "Mozilla/5.0 (Linux; Android 17; Pixel 10 Pro XL) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36"             -H "Accept-Language: ja-JP,ja;q=0.9,en-US;q=0.8,en;q=0.7"             -H "Cache-Control: no-cache"             "https://www.amazon.co.jp/dp/B0HJBC97W8" > page.html
          echo "SIZE=$(wc -c < page.html)"
          python - <<'PY'
          from pathlib import Path
          import re, html
          t=Path("page.html").read_text(errors="ignore")
          def clean(s): return re.sub(r"\s+"," ",html.unescape(re.sub(r"<[^>]+>"," ",s))).strip()
          for label,pat in [
            ("TITLE", r'<span[^>]+id="productTitle"[^>]*>(.*?)</span>'),
            ("AVAIL", r'<div[^>]+id="availability"[^>]*>(.*?)</div>'),
            ("MERCHANT", r'<div[^>]+id="merchant-info"[^>]*>(.*?)</div>'),
          ]:
            m=re.search(pat,t,re.I|re.S)
            print(label+"="+(clean(m.group(1)) if m else "NOT_FOUND"))
          prices=re.findall(r'¥\s?[0-9,]{5,}', clean(t))
          print("PRICES="+", ".join(dict.fromkeys(prices))[:500])
          for kw in ["在庫あり","現在在庫切れです","一時的に在庫切れ","カートに入れる","今すぐ買う","Amazon.co.jp"]:
            print(kw+"="+str(kw in t))
          PY
