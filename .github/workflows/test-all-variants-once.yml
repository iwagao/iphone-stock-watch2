name: Test All iPhone 18 Pro Max Variants Once

on:
  push:
    paths:
      - ".github/workflows/test-all-variants-once.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Low-request all-variant scan
        env:
          NTFY_TOPIC: test-only
        run: |
          python - <<'PY'
          import re
          import subprocess
          from urllib.parse import quote
          import watch

          SKUS = [
              ("256GB","ブラック","MJX54J/A"),("256GB","シルバー","MJX64J/A"),
              ("256GB","バーガンディ","MJX74J/A"),("256GB","グレイシャー","MJX84J/A"),
              ("512GB","ブラック","MJX94J/A"),("512GB","シルバー","MJXA4J/A"),
              ("512GB","バーガンディ","MJXC4J/A"),("512GB","グレイシャー","MJXD4J/A"),
              ("1TB","ブラック","MJXE4J/A"),("1TB","シルバー","MJXF4J/A"),
              ("1TB","バーガンディ","MJXG4J/A"),("1TB","グレイシャー","MJXH4J/A"),
              ("2TB","ブラック","MJXJ4J/A"),("2TB","シルバー","MJXK4J/A"),
              ("2TB","バーガンディ","MJXL4J/A"),("2TB","グレイシャー","MJXM4J/A"),
          ]

          def nearest(text, model, radius=1800):
              hits=[m.start() for m in re.finditer(re.escape(model),text,re.I)]
              if not hits:
                  return ""
              best=""
              score=-1
              for p in hits:
                  w=text[max(0,p-radius):min(len(text),p+radius)]
                  s=sum(x in w for x in [
                      "お取り寄せ","在庫あり","売り切れ","販売終了",
                      "予約開始待ち","予定数の販売を終了","カートに入れる"
                  ])
                  if s>score:
                      best,score=w,s
              return re.sub(r"\s+"," ",best)

          def classify(store, block):
              if not block:
                  return "UNKNOWN","not found"
              if store=="ヤマダ":
                  for x in ["好評につき売り切れました","売り切れました","販売終了しました","予約開始待ち","予約受付終了"]:
                      if x in block:
                          return "OUT",x
                  for x in ["お取り寄せ","在庫あり","24時間以内に出荷"]:
                      if x in block:
                          return "IN STOCK",x
              elif store=="ヨドバシ":
                  for x in ["予定数の販売を終了しました","予定数の販売を終了","販売終了","在庫なし","売り切れ"]:
                      if x in block:
                          return "OUT",x
                  for x in ["在庫あり","在庫残少","在庫僅少","残りわずか","お取り寄せ"]:
                      if x in block:
                          return "IN STOCK",x
              elif store=="Amazon":
                  for x in ["現在在庫切れです","一時的に在庫切れ","現在お取り扱いできません"]:
                      if x in block:
                          return "OUT",x
                  if "カートに入れる" in block or "add-to-cart" in block.lower():
                      return "POSSIBLE","purchase control in exact-model result"
              return "UNKNOWN","status not confirmed"

          # 1 request: Yamada search page, expected to contain all variants.
          try:
              yu="https://www.yamada-denkiweb.com/search/iPhone%2018%20Pro%20Max%20SIM%E3%83%95%E3%83%AA%E3%83%BC/"
              yt=watch.fetch_jina(yu)
              print("SOURCE | ヤマダ | bytes",len(yt))
              for cap,color,model in SKUS:
                  st,rs=classify("ヤマダ",nearest(yt,model))
                  print(f"RESULT | {st} | ヤマダ | {cap} | {color} | {model} | {rs}")
          except Exception as e:
              print("SOURCE_FAIL | ヤマダ |",repr(e))

          # 1 request: Yodobashi broad search page.
          try:
              yo="https://www.yodobashi.com/?word="+quote("iPhone 18 Pro Max",safe="")
              tt=watch.fetch_jina(yo)
              print("SOURCE | ヨドバシ | bytes",len(tt))
              for cap,color,model in SKUS:
                  st,rs=classify("ヨドバシ",nearest(tt,model))
                  print(f"RESULT | {st} | ヨドバシ | {cap} | {color} | {model} | {rs}")
          except Exception as e:
              print("SOURCE_FAIL | ヨドバシ |",repr(e))

          # 1 request: Amazon broad search page. Use --compressed and decode safely.
          try:
              au="https://www.amazon.co.jp/s?k="+quote("iPhone 18 Pro Max",safe="")
              cmd=[
                  "curl","--http1.1","--compressed","-L","-sS","--fail","--max-time","45",
                  "-A",watch.BROWSER_UA,
                  "-H","Accept-Language: ja-JP,ja;q=0.9,en;q=0.8",
                  au,
              ]
              p=subprocess.run(cmd,capture_output=True,timeout=50)
              at=p.stdout.decode("utf-8","ignore")
              print("SOURCE | Amazon | bytes",len(at),"rc",p.returncode)
              for cap,color,model in SKUS:
                  st,rs=classify("Amazon",nearest(at,model,3500))
                  print(f"RESULT | {st} | Amazon | {cap} | {color} | {model} | {rs}")
          except Exception as e:
              print("SOURCE_FAIL | Amazon |",repr(e))

          # K's broad search page: one request only. Its official dynamic inventory
          # field is normally omitted by Reader, so do not infer stock from legends.
          try:
              ku="https://www.ksdenki.com/shop/goods/search.aspx?keyword="+quote("iPhone 18 Pro Max",safe="")
              kt=watch.fetch_jina(ku)
              print("SOURCE | ケーズ | bytes",len(kt))
              for cap,color,model in SKUS:
                  b=nearest(kt,model)
                  c=re.sub(r"\s+"," ",b)
                  m=re.search(r"在庫\s*[:：]\s*(?:\|\s*)?(販売終了|予約終了|在庫なし|売り切れ)",c)
                  if m:
                      st,rs="OUT","在庫:"+m.group(1)
                  else:
                      m=re.search(r"在庫\s*[:：]\s*(?:\|\s*)?(在庫あり|在庫僅少|残りわずか)",c)
                      st,rs=("IN STOCK","在庫:"+m.group(1)) if m else ("UNKNOWN","official inventory field not confirmed")
                  print(f"RESULT | {st} | ケーズ | {cap} | {color} | {model} | {rs}")
          except Exception as e:
              print("SOURCE_FAIL | ケーズ |",repr(e))
          PY
