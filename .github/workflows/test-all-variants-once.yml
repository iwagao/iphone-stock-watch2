name: Test All iPhone 18 Pro Max Variants Once

on:
  push:
    paths:
      - ".github/workflows/test-all-variants-once.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Confirm known non-black capacity candidate
        env:
          NTFY_TOPIC: test-only
        run: |
          python - <<'PY'
          import re
          import watch

          tests = [
              ("512GB","バーガンディ","MJXC4J/A","4549995734843","https://www.yamada-denkiweb.com/7164959014/"),
              ("512GB","シルバー","MJXA4J/A","4549995734799","https://www.yamada-denkiweb.com/7164958017/"),
              ("512GB","グレイシャー","MJXD4J/A","4549995734898","https://www.yamada-denkiweb.com/7164960010/"),
              ("256GB","ブラック","MJX54J/A","4549995734546","https://www.yamada-denkiweb.com/7164953012/"),
          ]

          neg=["好評につき売り切れました","売り切れました","販売終了しました","予約開始待ち","予約受付終了"]
          pos=["お取り寄せ","在庫あり","24時間以内に出荷"]

          for cap,color,model,jan,url in tests:
              try:
                  t=watch.fetch_jina(url)
                  p=t.lower().find(model.lower())
                  b=t[max(0,p-5000):p+7000] if p>=0 else ""
                  if model.lower() not in b.lower() or jan not in b:
                      print(f"RESULT | UNKNOWN | {cap} | {color} | {model} | PRODUCT_NOT_FOUND")
                      continue
                  hit=next((x for x in neg if x in b),None)
                  if hit:
                      print(f"RESULT | OUT | {cap} | {color} | {model} | {hit}")
                      continue
                  hit=next((x for x in pos if x in b),None)
                  purchase=("数量" in b or "カートに入れる" in b)
                  if hit and purchase:
                      print(f"RESULT | IN STOCK | {cap} | {color} | {model} | {hit} + purchase control")
                  elif hit:
                      print(f"RESULT | POSSIBLE | {cap} | {color} | {model} | {hit}")
                  else:
                      print(f"RESULT | UNKNOWN | {cap} | {color} | {model} | STATUS_UNKNOWN")
              except Exception as e:
                  print(f"RESULT | UNKNOWN | {cap} | {color} | {model} | FETCH_FAIL {e}")
          PY
