name: Run Amazon 16 Once

on:
  push:
    paths:
      - ".github/workflows/run-amazon-all-once.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python amazon_all_variants.py
