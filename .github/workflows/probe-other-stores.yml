name: Probe Other Stores

on:
  push:
    paths:
      - ".github/workflows/probe-other-stores.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Amazon product fields
        shell: bash
        run: |
          set +e
          rm -f amazon.html
          ua="Mozilla/5.0 (Linux; Android 16; Pixel 10 Pro XL) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36"
          url="https://www.amazon.co.jp/dp/B0HJ9ZYXPV"
          code=$(curl --http1.1 -L -sS --max-time 40 -A "$ua" -H "Accept-Language: ja-JP,ja;q=0.9" -o amazon.html -w "%{http_code}" "$url")
          echo "HTTP=$code BYTES=$(wc -c < amazon.html 2>/dev/null || echo 0)"
          echo "MODEL=$(grep -Fic 'MJX54J/A' amazon.html 2>/dev/null || true)"
          echo "PRICE_239800=$(grep -Fc '239,800' amazon.html 2>/dev/null || true)"
          echo "ADD_CART=$(grep -Fic 'add-to-cart-button' amazon.html 2>/dev/null || true)"
          echo "BUY_NOW=$(grep -Fic 'buy-now-button' amazon.html 2>/dev/null || true)"
          echo "MERCHANT=$(grep -Fic 'merchant-info' amazon.html 2>/dev/null || true)"
          echo "AMAZON_SELLER=$(grep -Fic 'Amazon.co.jp' amazon.html 2>/dev/null || true)"
          echo "OUT_OF_STOCK=$(grep -Eic '現在在庫切れです|一時的に在庫切れ|現在お取り扱いできません' amazon.html 2>/dev/null || true)"
