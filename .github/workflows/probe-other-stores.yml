name: Probe Other Stores

on:
  push:
    paths:
      - ".github/workflows/probe-other-stores.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry Amazon and Bic
        shell: bash
        run: |
          set +e
          ua="Mozilla/5.0 (Linux; Android 16; Pixel 10 Pro XL) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36"
          urls=(
            "Amazon.co.jp|https://www.amazon.co.jp/dp/B0HJ9ZYXPV"
            "ビックカメラ|https://www.biccamera.com/bc/item/15593282/"
          )
          for item in "${urls[@]}"; do
            name="${item%%|*}"; url="${item#*|}"
            echo "=== $name RETRY ==="
            code=$(curl --http1.1 -L -sS --max-time 40 -A "$ua" -H "Accept-Language: ja-JP,ja;q=0.9" -o direct.txt -w "%{http_code}" "$url")
            bytes=$(wc -c < direct.txt 2>/dev/null || echo 0)
            jan=$(grep -Foc "4549995734546" direct.txt 2>/dev/null || true)
            model=$(grep -Fic "MJX54J/A" direct.txt 2>/dev/null || true)
            captcha=$(grep -Eic "captcha|robot|automated access|Access Denied|アクセスを遮断" direct.txt 2>/dev/null || true)
            title=$(grep -oi '<title[^>]*>[^<]*' direct.txt 2>/dev/null | head -1 | sed 's/<title[^>]*>//I' | tr '\n' ' ')
            echo "DIRECT http=$code bytes=$bytes jan=$jan model=$model blockwords=$captcha title=$title"
          done
