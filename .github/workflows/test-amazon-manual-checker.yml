name: Test Amazon Manual Checker

on:
  push:
    paths:
      - ".github/workflows/test-amazon-manual-checker.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python amazon_all_variants.py
