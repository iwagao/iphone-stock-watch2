name: Test Other iPhone Colors

on:
  push:
    paths:
      - ".github/workflows/test-other-colors.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - color: バーガンディ
            model: MJX74J/A
            jan: "4549995734645"
            asin: B0HJB6YR8X
            yamada: "https://www.yamada-denkiweb.com/7164955016/"
            store: amazon
          - color: バーガンディ
            model: MJX74J/A
