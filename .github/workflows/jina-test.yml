name: Jina Reader Test

on:
  push:
    paths:
      - "jina_test.py"
      - ".github/workflows/jina-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - run: python jina_test.py
