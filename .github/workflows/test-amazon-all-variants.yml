name: Test Amazon All iPhone Variants

on:
  push:
    paths:
      - ".github/workflows/test-amazon-all-variants.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Check all Amazon variants sequentially
        env:
          NTFY_TOPIC: test-only
        run: |
          python - <<'PY'
          import time
          import watch

          SKUS = [
              ("256GB","ブラック","MJX54J/A","B0HJ9ZYXPV"),
              ("256GB","シルバー","MJX64J/A","B0HJBCT1D5"),
              ("256GB","バーガンディ","MJX74J/A","B0HJB6YR8X"),
              ("256GB","グレイシャー","MJX84J/A","B0HJB7L347"),
              ("512GB","ブラック","MJX94J/A","B0HJB4296X"),
              ("512GB","シルバー","MJXA4J/A","B0HJB69RVJ"),
              ("512GB","バーガンディ","MJXC4J/A","B0HJB72MGS"),
              ("512GB","グレイシャー","MJXD4J/A","B0HJBHQY2N"),
              ("1TB","ブラック","MJXE4J/A","B0HJB36LR2"),
              ("1TB","シルバー","MJXF4J/A","B0HJB7V8R5"),
              ("1TB","バーガンディ","MJXG4J/A","B0HJB4RVLW"),
              ("1TB","グレイシャー","MJXH4J/A","B0HJB65BLC"),
              ("2TB","ブラック","MJXJ4J/A","B0HJ9VS44C"),
              ("2TB","シルバー","MJXK4J/A","B0HJB4LCRD"),
              ("2TB","バーガンディ","MJXL4J/A","B0HJ9Y9FN4"),
              ("2TB","グレイシャー","MJXM4J/A","B0HJBHHXK2"),
          ]

          for capacity,color,model,asin in SKUS:
              watch.MODEL=model
              url=f"https://www.amazon.co.jp/dp/{asin}"

              try:
                  page=watch.fetch_amazon(url)
              except Exception as e:
                  print(f"RESULT | UNKNOWN | {capacity} | {color} | {model} | FETCH_FAIL {e} | ASIN {asin}")
                  time.sleep(3)
                  continue

              low=page.lower()
              ap=low.find('id="availability"')
              availability=page[ap:ap+14000] if ap>=0 else page

              neg=next((x for x in [
                  "現在在庫切れです",
                  "一時的に在庫切れ",
                  "現在お取り扱いできません",
              ] if x in availability or x in page),None)

              if neg:
                  print(f"RESULT | OUT | {capacity} | {color} | {model} | {neg} | ASIN {asin}")
                  time.sleep(3)
                  continue

              has_cart=(
                  'id="add-to-cart-button"' in page
                  or 'id="buy-now-button"' in page
                  or 'name="submit.add-to-cart"' in page
              )
              mp=low.find('id="merchant-info"')
              merchant=page[mp:mp+12000] if mp>=0 else ""
              amazon_seller="Amazon.co.jp" in merchant

              if has_cart and amazon_seller:
                  print(f"RESULT | IN STOCK | {capacity} | {color} | {model} | Amazon.co.jp seller + purchase button | ASIN {asin}")
              elif has_cart:
                  print(f"RESULT | POSSIBLE | {capacity} | {color} | {model} | purchase button but non-Amazon seller | ASIN {asin}")
              else:
                  print(f"RESULT | UNKNOWN | {capacity} | {color} | {model} | no explicit out-of-stock phrase and no purchase button | ASIN {asin}")

              time.sleep(3)
          PY
