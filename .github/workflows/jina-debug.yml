name: Jina Debug
on:
  push:
    paths:
      - "debug_jina.py"
      - ".github/workflows/jina-debug.yml"
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2
      - run: python debug_jina.py
