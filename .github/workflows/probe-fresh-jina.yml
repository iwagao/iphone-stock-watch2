name: Probe Fresh Jina

on:
  push:
    paths:
      - ".github/workflows/probe-fresh-jina.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Test improved parsers
        env:
          NTFY_TOPIC: test-only
        run: |
          python - <<'PY'
          import watch
          for target in watch.TARGETS:
              try:
                  text = watch.fetch_target(target)
                  result = watch.check_target(text, target)
                  print(target["name"], result)
              except Exception as e:
                  print(target["name"], "EXCEPTION", repr(e))
          PY
