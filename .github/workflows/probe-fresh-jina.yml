name: Probe Fresh Jina

on:
  push:
    paths:
      - ".github/workflows/probe-fresh-jina.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Find Yodobashi target product
        shell: bash
        run: |
          set -e
          curl --http1.1 -L -sS --max-time 55 \
            -A "Mozilla/5.0" \
            -H "Accept: text/plain" \
            -H "X-No-Cache: true" \
            -H "X-Cache-Tolerance: 0" \
            -o page.txt "https://r.jina.ai/https://www.yodobashi.com/?word=MJX54J%2FA"
          python - <<'PY'
          import re
          t=open('page.txt',encoding='utf-8',errors='ignore').read()
          low=t.lower()
          for m in re.finditer('mjx54j/a',low):
              s=max(0,m.start()-1800); e=min(len(t),m.end()+2200)
              w=t[s:e]
              links=re.findall(r'https://www\.yodobashi\.com/product/[0-9]+/',w)
              if links:
                  print("MODEL_POS",m.start())
                  print("LINKS",list(dict.fromkeys(links)))
                  print("SNIP",re.sub(r'\s+',' ',w)[:3800])
          PY
