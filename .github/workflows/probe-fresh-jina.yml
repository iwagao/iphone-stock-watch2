name: Probe Fresh Jina

on:
  push:
    paths:
      - ".github/workflows/probe-fresh-jina.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe K's rendering variants
        shell: bash
        run: |
          set +e
          url="https://r.jina.ai/https://www.ksdenki.com/shop/g/g4549995734546/"
          for mode in body shadow cf; do
            echo "=== $mode ==="
            args=(-H "Accept: text/plain" -H "X-No-Cache: true" -H "X-Cache-Tolerance: 0")
            if [ "$mode" = "body" ]; then
              args+=(-H "X-Target-Selector: body")
            elif [ "$mode" = "shadow" ]; then
              args+=(-H "X-With-Shadow-Dom: true" -H "X-With-Iframe: true")
            else
              args+=(-H "X-Engine: cf-browser-rendering" -H "X-Target-Selector: body")
            fi
            curl --http1.1 -L -sS --max-time 55 "${args[@]}" -o out.txt "$url"
            python - "$mode" <<'PY'
          import sys,os,re
          mode=sys.argv[1]
          t=open('out.txt',encoding='utf-8',errors='ignore').read() if os.path.exists('out.txt') else ''
          print("bytes",len(t))
          for k in ['MJX54J/A','4549995734546','在庫:販売終了','販売終了','在庫あり','239,800円','Web価格']:
              print(k,t.count(k))
          p=t.find('在庫')
          if p>=0:
              print("SNIP",re.sub(r'\s+',' ',t[max(0,p-500):p+1800])[:2300])
          PY
          done
